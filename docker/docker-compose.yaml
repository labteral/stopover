version: "3.5"

x-logging: &default-logging
  options:
    max-size: "10m"
    max-file: "5"
  driver: json-file

networks:
  stopover:
    name: stopover

services:
  stopover:
    container_name: stopover-server
    # Always built from this repository; never pulled from a registry.
    image: stopover-server:local
    pull_policy: build
    build:
      context: ..
      dockerfile: docker/Dockerfile
    volumes:
      - ./config.yaml:/opt/stopover/config.yaml:ro
      - ./data/:/opt/stopover/data/:rw
    ports:
      - 5704:5704
    logging: *default-logging
    restart: always
    networks:
      - stopover
