---
auth:
  guest: guest

global:
  port: 5704
  threads: 4
  max_pending_requests: 256
  max_pending_bytes: 536870912
  max_stream_pending_requests: 64
  max_stream_pending_bytes: 268435456
  max_request_bytes: 134217728
  data_dir: ./data
  receiver_timeout: 10
  rebalance_interval: 5
  prune_interval: 3600
  partitions: 1
  ttl: 2592000 # 30 days
  
streams:
  test:
    partitions: 4
